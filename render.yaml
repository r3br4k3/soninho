services:
  - type: web
    name: soninhos
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: soninhos-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/soninhos.db
